services:
  postgres:
    image: postgres:16

    container_name: peerrent-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: peerrent
      POSTGRES_PASSWORD: peerrent123
      POSTGRES_DB: peerrent_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: